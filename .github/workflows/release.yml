name: Tag & Release

# Runs on every push to main, not only on manifest.json changes: if a previous
# run failed (e.g. version mismatch), the next push retries the missing tag or
# release. Every step is idempotent, so runs with nothing to publish are no-ops.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/gamerpower_plus/manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not read version from manifest.json"
            exit 1
          fi
          CONST_VERSION=$(sed -n 's/^VERSION: Final = "\(.*\)"$/\1/p' custom_components/gamerpower_plus/const.py)
          if [ "$VERSION" != "$CONST_VERSION" ]; then
            echo "::error::manifest.json version $VERSION differs from const.py VERSION $CONST_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing tag and release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.tag == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        if: steps.check.outputs.release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes

      - name: Skip (already released)
        if: steps.check.outputs.tag == 'true' && steps.check.outputs.release == 'true'
        run: echo "Tag and release ${{ steps.version.outputs.version }} already exist, skipping."
